services:
  # NetCoop AI Unified Web Service (FastAPI + React SPA + SQLite)
  - type: web
    name: netcoop-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: standard
    branch: main
    healthCheckPath: /health
    disk:
      name: netcoop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NETCOOP_DB_PATH
        value: /var/data/netcoop.db
      - key: ALLOWED_ORIGINS
        value: "*"
